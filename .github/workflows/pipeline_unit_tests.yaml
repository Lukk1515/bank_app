name: Run Unit Tests on PR

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      
jobs:

  test:
    runs-on: ubuntu-latest

    services:
        postgres:
          image: postgres
          env:
            POSTGRES_DB: db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
          ports:
            - 5432:5432
          options: >-
            --health-cmd="pg_isready"
            --health-interval=10s
            --health-timeout=5s
            --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # adjust to your preferred Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Run Unit tests
        run: |
          pytest ./tests/unit/unit_tests_bank_app.py
        env:
          USER: postgres
          DBNAME: db        # use DBNAME here, matching code
          PASSWORD: postgres
          HOST: localhost
          
      - name: Run Integration Tests
        run: |
          pytest ./tests/integration/bank_app.py
        env:
          USER: postgres
          DBNAME: db        # use DBNAME here, matching code
          PASSWORD: postgres
          HOST: localhost
