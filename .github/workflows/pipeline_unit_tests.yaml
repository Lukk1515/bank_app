name: Run Unit Tests on PR

on:
  pull_request:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    service:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # adjust to your preferred Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Run Unit tests
        run: |
          pytest ./tests/unit/unit_tests_bank_app.py
          
      - name: Run Integration Tests
        run: |
          pytest ./tests/integration/bank_app.py
        env:
          USER: postgres
          DB_NAME: db
          PASSWORD: postgres
          HOST: localhost
