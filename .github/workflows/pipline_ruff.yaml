name: Run ruff checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:

  ruff_checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'  # adjust to your preferred Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff checks
        run: |
          ruff check src
      